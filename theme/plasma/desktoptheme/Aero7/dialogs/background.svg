<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Aero7 light glass popup surface.

  Plasma consumes the named pieces below as a nine-slice FrameSvg. The fill
  is intentionally translucent so KWin blur remains visible, while the
  explicit light color prevents a dark fallback menu from showing through.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#edf4fa" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glass-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.99"/>
      <stop offset="1" stop-color="#f3f8fc" stop-opacity="0.93"/>
    </linearGradient>
  </defs>

  <!-- Keep the center stretchable. Tiling this vertical gradient restarts it
       every 16 px and creates visible horizontal bands in Plasma popups. -->
  <rect id="hint-stretch-borders" x="4" y="1" width="2" height="2" fill="#ff6600"/>
  <rect id="hint-top-margin" x="8" y="1" width="1" height="7" fill="#ff6600"/>
  <rect id="hint-bottom-margin" x="10" y="1" width="1" height="7" fill="#ff6600"/>
  <rect id="hint-left-margin" x="12" y="1" width="7" height="1" fill="#ff6600"/>
  <rect id="hint-right-margin" x="12" y="3" width="7" height="1" fill="#ff6600"/>

  <g id="center">
    <rect x="24" y="24" width="16" height="16" fill="url(#glass)"/>
  </g>
  <g id="top">
    <rect x="24" y="16" width="16" height="8" fill="url(#glass-top)"/>
    <rect x="24" y="16" width="16" height="1" fill="#6f91ad" fill-opacity="0.92"/>
    <rect x="24" y="17" width="16" height="1" fill="#ffffff" fill-opacity="0.78"/>
  </g>
  <g id="bottom">
    <rect x="24" y="40" width="16" height="8" fill="url(#glass)"/>
    <rect x="24" y="47" width="16" height="1" fill="#6f91ad" fill-opacity="0.92"/>
  </g>
  <g id="left">
    <rect x="16" y="24" width="8" height="16" fill="url(#glass)"/>
    <rect x="16" y="24" width="1" height="16" fill="#6f91ad" fill-opacity="0.92"/>
    <rect x="17" y="24" width="1" height="16" fill="#ffffff" fill-opacity="0.72"/>
  </g>
  <g id="right">
    <rect x="40" y="24" width="8" height="16" fill="url(#glass)"/>
    <rect x="47" y="24" width="1" height="16" fill="#6f91ad" fill-opacity="0.92"/>
  </g>
  <g id="topleft">
    <rect x="16" y="16" width="8" height="8" fill="url(#glass-top)"/>
    <path d="M24 16h-6a2 2 0 0 0-2 2v6" fill="none" stroke="#6f91ad" stroke-opacity="0.92"/>
    <path d="M24 17h-5a2 2 0 0 0-2 2v5" fill="none" stroke="#ffffff" stroke-opacity="0.72"/>
  </g>
  <g id="topright">
    <rect x="40" y="16" width="8" height="8" fill="url(#glass-top)"/>
    <path d="M40 16h6a2 2 0 0 1 2 2v6" fill="none" stroke="#6f91ad" stroke-opacity="0.92"/>
    <path d="M40 17h5a2 2 0 0 1 2 2v5" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
  </g>
  <g id="bottomleft">
    <rect x="16" y="40" width="8" height="8" fill="url(#glass)"/>
    <path d="M16 40v6a2 2 0 0 0 2 2h6" fill="none" stroke="#6f91ad" stroke-opacity="0.92"/>
  </g>
  <g id="bottomright">
    <rect x="40" y="40" width="8" height="8" fill="url(#glass)"/>
    <path d="M48 40v6a2 2 0 0 1-2 2h-6" fill="none" stroke="#6f91ad" stroke-opacity="0.92"/>
  </g>
</svg>
