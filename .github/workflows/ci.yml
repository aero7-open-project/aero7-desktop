name: Aero7 Desktop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Install build and validation dependencies
        run: >-
          pacman -Syu --noconfirm
          cmake ninja python git nodejs shellcheck gettext desktop-file-utils
          qt6-declarative qt6-tools kirigami kio kservice solid
          networkmanager-qt pulseaudio-qt plasma-workspace layer-shell-qt
          kpipewire kwindowsystem qt6-svg
      - name: Static and QML validation
        run: tests/ci/validate-static.sh
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON && cmake --build build
      - name: Unit, backend, service, parser, migration, and session tests
        run: ctest --test-dir build --output-on-failure
      - name: Staged install and startup smoke test
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          test -x stage/usr/bin/aero7-session
          test -x stage/usr/bin/aero7-file-explorer
          test -x stage/usr/bin/aero7-recovery-ui
      - name: Build and test the included Desktop Gadgets runtime
        run: |
          cmake -S companions/aero7-gadgets -B gadgets-build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON
          cmake --build gadgets-build
          QT_QPA_PLATFORM=offscreen ctest --test-dir gadgets-build --output-on-failure
          DESTDIR="$PWD/gadgets-stage" cmake --install gadgets-build
          test -x gadgets-stage/usr/bin/aero7-gadget-host
          test -L gadgets-stage/usr/bin/aero7-gadget-gallery

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Install package build dependencies
        run: >-
          pacman -Syu --noconfirm
          cmake ninja python git gettext qt6-declarative kirigami kio kservice
          solid networkmanager-qt pulseaudio-qt plasma-workspace layer-shell-qt
          kpipewire kwindowsystem qt6-svg
      - name: Build an unprivileged Arch package
        run: |
          useradd -m builder
          package_root=/tmp/aero7-package-ci
          mkdir -p "$package_root"
          cp packaging/arch/PKGBUILD "$package_root/PKGBUILD"
          bsdtar -czf "$package_root/aero7-desktop-0.2.0.tar.gz" \
            -s '|^\./|aero7-desktop-0.2.0/|' \
            --exclude .git --exclude build --exclude dist --exclude artifacts .
          chown -R builder:builder "$package_root"
          su builder -c "cd '$package_root' && makepkg --nodeps --noconfirm"
          test -n "$(find "$package_root" -maxdepth 1 -name 'aero7-desktop-*.pkg.tar.zst' -print -quit)"
