name: Aero7 Desktop Source Checks

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install source validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
      - name: Validate source without compilation or package builds
        run: bash tests/ci/validate-source.sh
      - name: Check wallpaper persistence and session reconciliation
        run: |
          node tests/session/test_wallpaper_defaults.js
          python3 tests/session/test_reconcile_execution.py
          python3 tests/unit/test_ci_policy.py
