<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- A real fixed-pitch fallback for generic terminal/editor requests.
       Explicit families and the earlier per-user fontconfig rules remain free
       to override this default. Do not rewrite QTerminal user preferences. -->
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
